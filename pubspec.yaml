name: cuentos_cielo
description: "Cuentos interactivos para Valentina"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1
  audioplayers: ^6.1.0
  cached_network_image: ^3.4.1
  animate_do: ^3.3.4
  flutter_staggered_animations: ^1.1.1
  page_transition: ^2.1.0
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21